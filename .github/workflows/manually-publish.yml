# Manually publish to GitHub Packages.
#
# This is the backup for Maven Central failures, e.g. when the Central Portal
# rejects a valid bundle (https://github.com/CompEvol/morph-models/issues/22).
# The normal release path is still ci-publish.yml (tag push -> Maven Central).
#
# To run: Actions -> "Manually Publish to GitHub Packages" -> Run workflow
# (from master), and enter the release tag to publish, e.g. v1.3.1-beta1.
# The version is taken from the tag (v1.3.1-beta1 -> 1.3.1-beta1), or from
# the "version" input if given.
#
# Note: GitHub Packages requires authentication to download, even for public
# packages. Users need a PAT with read:packages in ~/.m2/settings.xml (server
# id "github") and the repository https://maven.pkg.github.com/CompEvol/morph-models.

name: Manually Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check out and publish, e.g. v1.3.1-beta1"
        required: true
      version:
        description: "Version to publish (leave empty to derive from the tag)"
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 25 (Azul Zulu) for GitHub Packages
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=${TAG#v}
          fi
          echo "Publishing version: $VERSION"
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Publish to GitHub Packages
        run: mvn -B deploy -DskipTests -DaltDeploymentRepository=github::https://maven.pkg.github.com/CompEvol/morph-models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
